<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broach For 12 | Wilson County, TN</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
    background: #f4f6f8;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

header {
    background: #0b2d4d;
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}

header h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 1px;
}

header a {
    background: #f26522;
    color: white;
    padding: 8px 14px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
    font-size: 14px;
}

.hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    background: linear-gradient(rgba(11,45,77,0.85), rgba(11,45,77,0.85)), url('campaign-image.png') center/cover no-repeat;
    color: white;
    min-height: 100vh;
}

.hero-content {
    max-width: 700px;
}

.hero h2 {
    font-size: 42px;
    margin: 0;
}

.hero span {
    color: #f26522;
}

.hero p {
    font-size: 16px;
    margin-top: 10px;
}

.donate-btn {
    margin-top: 18px;
    display: inline-block;
    padding: 14px 26px;
    background: #f26522;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
}

.values {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.value-box {
    padding: 12px 16px;
    border-radius: 8px;
    background: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    font-size: 14px;
    font-weight: bold;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 10px;
    font-size: 12px;
    flex-shrink: 0;
}

</style>
</head>
<body>

</header>

    <div class="hero-content">
        <h2>Support the Campaign <span>Today</span></h2>
        <p>Focused on Wilson County • Real Community Solutions</p>

        -->
    </div>
</section>

<footer>
    © 2026 Broach For 12 Campaign | Wilson County, TN
</footer>

</body>
</html>
