<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broach For 12 | Wilson County, TN</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
    background: #f4f6f8;
}

header {
    position: sticky;
    top: 0;
    background: #0b2d4d;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
}

header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 1px;
}

header a {
    background: #f26522;
    color: white;
    padding: 10px 16px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
}

.hero {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(rgba(11,45,77,0.85), rgba(11,45,77,0.85)), url('campaign-image.png') center/cover no-repeat;
    color: white;
}

.hero-content {
    max-width: 700px;
}

.hero h2 {
    font-size: 54px;
    margin: 0;
}

.hero span {
    color: #f26522;
}

.hero p {
    font-size: 20px;
    margin-top: 15px;
    letter-spacing: 2px;
}

.donate-btn {
    margin-top: 25px;
    display: inline-block;
    padding: 16px 30px;
    background: #f26522;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.2s;
}

.donate-btn:hover {
    background: #d9541a;
}

.section {
    padding: 60px 20px;
    text-align: center;
}

.section h3 {
    font-size: 30px;
    color: #0b2d4d;
}

.values {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

.value-box {
    width: 250px;
    padding: 20px;
    border-radius: 10px;
    background: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    font-weight: bold;
}

.cta {
    background: #0b2d4d;
    color: white;
    padding: 60px 20px;
    text-align: center;
}

.cta a {
    display: inline-block;
    margin-top: 20px;
    padding: 16px 28px;
    background: #f26522;
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 8px;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 13px;
}

</style>
</head>
<body>

<header>
    <h1></h1>
    <a href="https://secure.actblue.com/donate/chris-broach-1" target="_blank">Donate Now</a>
</header>

<section class="hero">
    <div class="hero-content">
        <h2>BROACH FOR <span>12</span></h2>
        <p></p>
        <a class="donate-btn" href="https://secure.actblue.com/donate/chris-broach-1" target="_blank">Donate Now</a>
    </div>
</section>

<section class="section">
    <h3>Focused on Wilson County</h3>
    <div class="values">
        <div class="value-box">Putting People First</div>
        <div class="value-box">Local Experience</div>
        <div class="value-box">Real Community Solutions</div>
    </div>
</section>

<section class="cta">
    <h2>Support the Campaign Today</h2>
    <p>Your support keeps this movement moving forward.</p>
    <a href="https://secure.actblue.com/donate/chris-broach-1" target="_blank">Donate Now</a>
</section>

<footer>
    © 2026 Broach For 12 Campaign | Wilson County, TN
</footer>

</body>
</html>
