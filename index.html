<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broach For 12 | Wilson County, TN</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(rgba(11,45,77,0.85), rgba(11,45,77,0.85)), url('campaign-image.png') center/cover no-repeat;
}

.hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    overflow: hidden;
}

.hero-content {
    max-width: 700px;
    padding: 20px;
}

.hero h2 {
    font-size: 42px;
    margin: 0;
}

.hero span {
    color: #f26522;
}

.hero p {
    font-size: 16px;
    margin-top: 10px;
}

.donate-btn {
    margin-top: 18px;
    display: inline-block;
    padding: 14px 26px;
    background: #f26522;
    color: white;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
}

.values {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.value-box {
    padding: 12px 16px;
    border-radius: 8px;
    background: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    font-size: 14px;
    font-weight: bold;
}

footer {
    background: #111;
    color: white;
    text-align: center;
    font-size: 12px;
    flex-shrink: 0;
    padding: 10px;
}
</style>
</head>
<body>

<section class="hero">
    <div class="hero-content">
        <h2>Support the Campaign <span>Today</span></h2>
        <p>Focused on Wilson County • Real Community Solutions</p>
        <a class="donate-btn" href="https://secure.actblue.com/donate/chris-broach-1" target="_blank">Donate Now</a>
    </div>
</section>

<footer>
    © 2026 Broach For 12 Campaign | Wilson County, TN
</footer>

</body>
</html>
