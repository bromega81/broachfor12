<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broach For 12 | Wilson County, TN</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #1a1a1a;
}
header {
    background: #0b2d4d;
    color: white;
    padding: 20px;
    text-align: center;
}
header h1 {
    margin: 0;
    font-size: 42px;
}
.hero {
    display: flex;
    flex-wrap: wrap;
}
.hero-left {
    flex: 1;
    padding: 60px;
}
.hero-left h2 {
    font-size: 48px;
    color: #0b2d4d;
}
.hero-left span {
    color: #f26522;
}
.hero-right {
    flex: 1;
    min-height: 400px;
    background: #ddd;
}
.section {
    padding: 60px 20px;
    text-align: center;
}
.values {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}
.value-box {
    width: 250px;
    padding: 20px;
    border: 2px solid #0b2d4d;
}
.cta {
    background: #0b2d4d;
    color: white;
    padding: 40px;
    text-align: center;
}
.cta a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 24px;
    background: #f26522;
    color: white;
    text-decoration: none;
    font-weight: bold;
}
footer {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}
</style>
</head>
<body>

<header>
    <h1>BROACH FOR 12</h1>
    <p>Wilson County, Tennessee</p>
</header>

<section class="hero">
    <div class="hero-left">
        <h2>BROACH FOR <span>12</span></h2>
        <p>FAITH. FAMILY. COMMUNITY.</p>
    </div>
    <div class="hero-right"></div>
</section>

<section class="section">
    <h3>Priorities</h3>
    <div class="values">
        <div class="value-box">Putting People First</div>
        <div class="value-box">Local Experience</div>
        <div class="value-box">Working Together</div>
    </div>
</section>

<section class="cta">
    <h2>Support the Campaign</h2>
    <a href="https://secure.actblue.com/donate/chris-broach-1" target="_blank">Donate Now</a>
</section>

<footer>
    © 2026 Broach For 12 Campaign
</footer>

</body>
</html>
